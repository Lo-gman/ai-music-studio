name: Build a music video

on:
  workflow_dispatch:
    inputs:
      style:
        description: Music mood
        required: true
        default: study
        type: choice
        options:
          - study
          - sleep
          - chill
      minutes:
        description: Track length (1 to 30 minutes)
        required: true
        default: "5"
  schedule:
    - cron: "0 9 * * *"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Select daily mood
        id: mood
        shell: bash
        run: |
          if [ -n "${{ inputs.style }}" ]; then
            echo "style=${{ inputs.style }}" >> "$GITHUB_OUTPUT"
          else
            day=$(date -u +%u)
            case "$day" in
              1|4) echo "style=study" >> "$GITHUB_OUTPUT" ;;
              2|5) echo "style=chill" >> "$GITHUB_OUTPUT" ;;
              *) echo "style=sleep" >> "$GITHUB_OUTPUT" ;;
            esac
          fi
          if [ -n "${{ inputs.minutes }}" ]; then
            echo "minutes=${{ inputs.minutes }}" >> "$GITHUB_OUTPUT"
          else
            echo "minutes=5" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate original music and artwork
        run: python music_studio.py --style "${{ steps.mood.outputs.style }}" --minutes "${{ steps.mood.outputs.minutes }}" --out output
      - name: Render MP4 video
        run: |
          ffmpeg -y -loop 1 -i output/cover.jpg -i output/music.wav             -c:v libx264 -tune stillimage -pix_fmt yuv420p             -c:a aac -b:a 192k -shortest -movflags +faststart             output/quiet-frequencies-${{ steps.mood.outputs.style }}.mp4
      - name: Save video as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: quiet-frequencies-${{ steps.mood.outputs.style }}-${{ github.run_number }}
          path: |
            output/*.mp4
            output/metadata.txt
          retention-days: 7
