name: Build a music video

on:
  workflow_dispatch:
    inputs:
      theme:
        description: Composition theme
        required: true
        default: rainy_cafe
        type: choice
        options:
          - rainy_cafe
          - forest_morning
          - ocean_dreams
          - deep_sleep
          - mountain_stream
          - desert_night
          - winter_cabin
          - night_forest
          - lofi_study
          - jazz_night
      minutes:
        description: Track length (1 to 15 minutes)
        required: true
        default: "3"
      instruments:
        description: Optional comma-separated instrument overrides
        required: false
        default: ""
      environments:
        description: Optional comma-separated environment overrides
        required: false
        default: ""
  schedule:
    - cron: "0 9 * * *"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Select daily theme
        id: config
        shell: bash
        run: |
          if [ -n "${{ inputs.theme }}" ]; then
            echo "theme=${{ inputs.theme }}" >> "$GITHUB_OUTPUT"
          else
            themes=(rainy_cafe forest_morning ocean_dreams deep_sleep mountain_stream desert_night winter_cabin night_forest lofi_study jazz_night)
            idx=$(( $(date -u +%j | sed 's/^0*//') % ${#themes[@]} ))
            echo "theme=${themes[$idx]}" >> "$GITHUB_OUTPUT"
          fi
          echo "minutes=${{ inputs.minutes || '3' }}" >> "$GITHUB_OUTPUT"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Generate thematic music, artwork, animated video, and run QC
        run: |
          ARGS="--theme ${{ steps.config.outputs.theme }} --minutes ${{ steps.config.outputs.minutes }} --out output --video --fps 10 --qc"
          if [ -n "${{ inputs.instruments }}" ]; then
            ARGS="$ARGS --instruments '${{ inputs.instruments }}'"
          fi
          if [ -n "${{ inputs.environments }}" ]; then
            ARGS="$ARGS --environments '${{ inputs.environments }}'"
          fi
          eval python music_studio.py $ARGS
      - name: Save video and provenance as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: quiet-frequencies-${{ steps.config.outputs.theme }}-${{ github.run_number }}
          path: |
            output/*.mp4
            output/cover.jpg
            output/metadata.txt
            library/catalog.json
          retention-days: 7
