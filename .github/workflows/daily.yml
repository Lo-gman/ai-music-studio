name: Daily Music Video Production

on:
  workflow_dispatch:
    inputs:
      style:
        description: "Music Style / Theme"
        required: true
        default: "deep_focus"
        type: choice
        options:
          - "deep_focus"
          - "lofi_instrumental"
          - "piano_ambient"
          - "concentration"
          - "deep_sleep"
          - "soft_piano"
          - "rain_atmosphere"
          - "ocean_nature"
          - "relaxing_electronic"
          - "lofi_chill"
          - "dreamy_ambient"
          - "jazzy_background"
          - "rainy_cafe"
          - "forest_morning"
          - "winter_cabin"
      minutes:
        description: "Track length in minutes"
        required: true
        default: "3"
  schedule:
    - cron: "0 9 * * *"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated test suite
        run: |
          python -m unittest discover -s tests -v

      - name: Select daily style
        id: config
        shell: bash
        run: |
          if [ -n "${{ inputs.style }}" ]; then
            echo "style=${{ inputs.style }}" >> "$GITHUB_OUTPUT"
          else
            STYLES=("deep_focus" "lofi_instrumental" "piano_ambient" "deep_sleep" "soft_piano" "rain_atmosphere" "relaxing_electronic" "lofi_chill" "dreamy_ambient" "jazzy_background")
            IDX=$(( $(date -u +%j | sed 's/^0*//') % ${#STYLES[@]} ))
            echo "style=${STYLES[$IDX]}" >> "$GITHUB_OUTPUT"
          fi
          echo "minutes=${{ inputs.minutes || '3' }}" >> "$GITHUB_OUTPUT"

      - name: Generate music, cover artwork, and metadata
        run: |
          mkdir -p output
          STYLE="${{ steps.config.outputs.style }}"
          MINUTES="${{ steps.config.outputs.minutes }}"
          if [ -f "src/music_studio.py" ]; then
            python src/music_studio.py --style "$STYLE" --minutes "$MINUTES" --out output
          else
            python music_studio.py --theme "$STYLE" --minutes "$MINUTES" --out output
          fi

      - name: Render video
        run: |
          STYLE="${{ steps.config.outputs.style }}"
          if [ -f "src/video_studio.py" ]; then
            python src/video_studio.py --audio output/music.wav --cover output/cover.jpg --out output/video.mp4 --style "$STYLE" --title "$STYLE - Quiet Frequencies"
          else
            python music_studio.py --theme "$STYLE" --minutes "${{ steps.config.outputs.minutes }}" --out output --video --fps 12 --qc
          fi

      - name: Save video and provenance as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: quiet-frequencies-${{ steps.config.outputs.style }}-${{ github.run_number }}
          path: |
            output/*.mp4
            output/*.wav
            output/*.mp3
            output/*.jpg
            output/*.txt
            output/*.json
            library/*.json
          retention-days: 7
